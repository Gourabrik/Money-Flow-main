<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MoneyFlow – Smart Expense Tracker</title>
    <meta name="description" content="Sign in or create your MoneyFlow account to track expenses, manage savings and take control of your finances.">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:    #3b82f6;
            --indigo:  #6366f1;
            --teal:    #14b8a6;
            --pink:    #f472b6;
            --dark:    #060d1a;
            --card-bg: rgba(8, 20, 42, 0.55);
            --border:  rgba(255,255,255,0.09);
            --text:    #f0f6ff;
            --muted:   rgba(200,220,255,0.45);
            --input-bg: rgba(255,255,255,0.06);
            --input-border: rgba(255,255,255,0.12);
            --input-focus: rgba(99,102,241,0.6);
            --error:   #f87171;
        }

        html, body {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background: var(--dark);
            overflow: hidden;
        }

        /* ── Canvas ────────────────────────────────────────── */
        #bg-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }

        /* ── Blobs ─────────────────────────────────────────── */
        .blobs { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .blob  { position: absolute; border-radius: 50%; filter: blur(100px); will-change: transform; }
        .blob-1 { width:600px;height:600px;top:-20%;left:-18%;background:rgba(59,130,246,.32);animation:drift1 24s ease-in-out infinite alternate; }
        .blob-2 { width:500px;height:500px;bottom:-12%;right:-12%;background:rgba(20,184,166,.26);animation:drift2 28s ease-in-out infinite alternate; }
        .blob-3 { width:350px;height:350px;top:40%;left:50%;background:rgba(99,102,241,.26);animation:drift3 20s ease-in-out infinite alternate; }

        @keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(30px,-50px) scale(1.07)} }
        @keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-40px,35px) scale(1.1)} }
        @keyframes drift3 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-55px,45px) scale(1.12)} }

        /* ── Grid overlay ──────────────────────────────────── */
        .grid-overlay {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
            background-size: 64px 64px;
            animation: gridScroll 70s linear infinite;
        }
        @keyframes gridScroll { from{background-position:0 0} to{background-position:64px 64px} }

        /* ── Page wrapper ──────────────────────────────────── */
        .page {
            position: relative; z-index: 10;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem;
            overflow-y: auto;
        }

        /* ── Card ──────────────────────────────────────────── */
        .card {
            width: 100%; max-width: 480px;
            border-radius: 28px;
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--border);
            box-shadow:
                0 40px 90px -20px rgba(0,0,0,.75),
                0 0 60px -10px rgba(59,130,246,.14),
                inset 0 1px 0 rgba(255,255,255,.1);
            padding: 2.5rem 2.25rem;
            opacity: 0;
            transform: translateY(28px) scale(.97);
            animation: revealCard .8s cubic-bezier(.2,.8,.2,1) .1s forwards;
        }
        @keyframes revealCard { to { opacity:1; transform:translateY(0) scale(1); } }

        /* ── Logo row ──────────────────────────────────────── */
        .logo-row {
            display: flex; align-items: center; gap: .65rem;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), var(--indigo));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(99,102,241,.4);
        }
        .logo-icon i { color:#fff; font-size:.9rem; }
        .logo-name { font-size:1.15rem; font-weight:700; letter-spacing:-.5px; }
        .logo-badge {
            margin-left: auto;
            font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            padding: .22rem .6rem; border-radius: 20px;
            background: rgba(99,102,241,.18); color: #a5b4fc;
            border: 1px solid rgba(99,102,241,.3);
        }

        /* ── Form header ───────────────────────────────────── */
        .form-header { margin-bottom: 1.75rem; }
        .form-header h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.5px; margin-bottom: .3rem; }
        .form-header p  { font-size: .85rem; color: var(--muted); }

        /* ── Auth error ────────────────────────────────────── */
        .auth-err {
            display: none;
            background: rgba(248,113,113,.12);
            border: 1px solid rgba(248,113,113,.3);
            border-radius: 10px;
            padding: .7rem 1rem;
            font-size: .82rem;
            color: #fca5a5;
            margin-bottom: 1.1rem;
            animation: shake .35s ease;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}
        }

        /* ── Fields ────────────────────────────────────────── */
        .field { margin-bottom: 1.1rem; }
        .field-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
        .field label { display: block; font-size: .78rem; font-weight: 600; color: rgba(200,215,255,.7); margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .6px; }
        .forgot { font-size: .78rem; color: #818cf8; text-decoration: none; transition: color .2s; }
        .forgot:hover { color: #c7d2fe; }

        /* ── Input wrap ────────────────────────────────────── */
        .input-wrap {
            position: relative;
            display: flex; align-items: center;
        }
        .input-wrap input {
            width: 100%;
            padding: .8rem 2.6rem .8rem 2.6rem;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: .92rem;
            outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
        }
        .input-wrap input::placeholder { color: rgba(200,220,255,.25); }
        .input-wrap input:focus {
            border-color: rgba(99,102,241,.65);
            box-shadow: 0 0 0 3px rgba(99,102,241,.18);
            background: rgba(255,255,255,.08);
        }
        .input-icon {
            position: absolute; left: .9rem;
            color: rgba(200,220,255,.3); font-size: .8rem;
            pointer-events: none;
        }
        .pw-toggle {
            position: absolute; right: .8rem;
            background: none; border: none; cursor: pointer;
            color: rgba(200,220,255,.35); font-size: .85rem;
            padding: .3rem; border-radius: 6px;
            transition: color .2s;
            display: flex; align-items: center; justify-content: center;
        }
        .pw-toggle:hover { color: #818cf8; }

        /* ── Field errors ──────────────────────────────────── */
        .err {
            display: none; margin-top: .3rem;
            font-size: .75rem; color: var(--error);
        }

        /* ── Remember row ──────────────────────────────────── */
        .remember {
            display: flex; align-items: center; gap: .5rem;
            margin-bottom: 1.4rem; font-size: .82rem; color: var(--muted);
        }
        .remember input[type="checkbox"] { accent-color: var(--indigo); width: 14px; height: 14px; cursor: pointer; }
        .remember label { cursor: pointer; }

        /* ── Primary button ────────────────────────────────── */
        .btn-primary {
            width: 100%;
            padding: .9rem 1.5rem;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            border: none; border-radius: 13px;
            color: #fff; font-family: 'Outfit', sans-serif;
            font-size: .95rem; font-weight: 600; letter-spacing: .3px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: .5rem;
            box-shadow: 0 6px 22px rgba(99,102,241,.4);
            transition: transform .2s, box-shadow .2s, opacity .2s;
        }
        .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99,102,241,.5); }
        .btn-primary:active { transform: translateY(0);    box-shadow: 0 4px 14px rgba(99,102,241,.35); }
        .btn-primary:disabled { opacity: .65; cursor: not-allowed; transform: none; }

        /* ── Divider ───────────────────────────────────────── */
        .divider {
            display: flex; align-items: center; gap: .75rem;
            margin: 1.25rem 0;
        }
        .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
        .divider span { font-size: .72rem; color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .8px; }

        /* ── Guest button ──────────────────────────────────── */
        .btn-guest {
            width: 100%;
            padding: .82rem 1.5rem;
            background: rgba(255,255,255,.05);
            border: 1.5px solid var(--border);
            border-radius: 13px;
            color: rgba(200,220,255,.7);
            font-family: 'Outfit', sans-serif;
            font-size: .88rem; font-weight: 500;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: .6rem;
            transition: background .22s, border-color .22s, color .22s, transform .2s;
        }
        .btn-guest:hover  {
            background: rgba(255,255,255,.1);
            border-color: rgba(255,255,255,.22);
            color: var(--text);
            transform: translateY(-1px);
        }
        .btn-guest:active  { transform: translateY(0); }
        .btn-guest:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        /* ── Mode toggle ───────────────────────────────────── */
        .mode-toggle {
            margin-top: 1.25rem;
            text-align: center;
            font-size: .82rem;
            color: var(--muted);
        }
        .mode-toggle a {
            color: #818cf8; text-decoration: none; font-weight: 600;
            transition: color .2s;
        }
        .mode-toggle a:hover { color: #c7d2fe; }

        /* ── Spinner ───────────────────────────────────────── */
        .spinner {
            width: 17px; height: 17px;
            border: 2.5px solid rgba(255,255,255,.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Particle canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Ambient blobs -->
<div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<!-- Grid -->
<div class="grid-overlay"></div>

<div class="page">
    <div class="card">

        <!-- Logo -->
        <div class="logo-row">
            <div class="logo-icon"><i class="fas fa-wallet"></i></div>
            <span class="logo-name">MoneyFlow</span>
            <span class="logo-badge">Pro</span>
        </div>

        <!-- Header -->
        <div class="form-header">
            <h2 id="form-title">Welcome Back</h2>
            <p  id="form-subtitle">Securely sign in to your dashboard</p>
        </div>

        <!-- Auth error -->
        <div id="auth-error" class="auth-err"></div>

        <!-- Form -->
        <form id="login-form" novalidate>
            <!-- Email -->
            <div class="field">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                </div>
                <p id="email-error" class="err">Please enter a valid email.</p>
            </div>

            <!-- Password -->
            <div class="field">
                <div class="field-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot" id="forgot-link">Forgot?</a>
                </div>
                <div class="input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" id="toggle-password" class="pw-toggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p id="password-error" class="err">Password required (min 6 chars).</p>
            </div>

            <!-- Remember -->
            <div class="remember">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Keep me signed in</label>
            </div>

            <!-- Submit -->
            <button type="submit" id="submit-btn" class="btn-primary">
                <span id="submit-text">Sign In to Dashboard</span>
                <div id="submit-spinner" class="spinner" style="display:none;"></div>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <hr><span>or continue as</span><hr>
        </div>

        <!-- Guest -->
        <button type="button" id="guest-login" class="btn-guest">
            <i class="fas fa-user-secret" style="opacity:.55;"></i>
            <span id="guest-text">Continue as Guest</span>
        </button>

        <!-- Mode toggle -->
        <p class="mode-toggle" id="mode-toggle">
            New to MoneyFlow? <a href="#" id="mode-link">Create an account</a>
        </p>
    </div>
</div>

<!-- Canvas particle system -->
<script>
(function(){
    const canvas = document.getElementById('bg-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];
    const COUNT = 80;

    function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    function rand(a,b){ return a + Math.random()*(b-a); }

    function Particle(){
        this.reset = function(){
            this.x = rand(0,W); this.y = rand(H*1.1, H*1.3);
            this.r = rand(.8,2.5); this.vx = rand(-.25,.25); this.vy = rand(-.3,.6);
            this.alpha = rand(.2,.6);
            const hue = [210,220,185,250,170][Math.floor(rand(0,5))];
            this.color = 'hsla('+hue+',75%,68%,';
        };
        this.reset(); this.y = rand(0,H);
        this.update = function(){ this.x+=this.vx; this.y-=this.vy; if(this.y<-10||this.x<-10||this.x>W+10) this.reset(); };
        this.draw   = function(){ ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle=this.color+this.alpha+')'; ctx.fill(); };
    }
    for(let i=0;i<COUNT;i++) particles.push(new Particle());

    function drawLines(){
        const lim = 110;
        for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++){
            const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d<lim){ ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.strokeStyle='rgba(100,160,255,'+(1-d/lim)*.14+')'; ctx.lineWidth=.5; ctx.stroke(); }
        }
    }

    function loop(){ ctx.clearRect(0,0,W,H); particles.forEach(p=>{p.update();p.draw();}); drawLines(); requestAnimationFrame(loop); }
    loop();
})();
</script>

<!-- Firebase login script (ES module) -->
<script type="module" src="login.js"></script>
</body>
</html>
